<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStore | Sneha Parmar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cloud-sidebar">
        <h2 style="color: #3b82f6;">CloudStore</h2>
        <button class="btn-upload">+ New Upload</button>
        <div style="margin-top: 40px;">
            <p style="color: #64748b; font-size: 14px;">MY FILES</p>
            <p style="font-weight: 500; margin-top: 20px;">All Files</p>
            <p style="color: #64748b; margin-top: 15px;">Recent</p>
            <p style="color: #64748b; margin-top: 15px;">Starred</p>
            <p style="color: #64748b; margin-top: 15px;">Trash</p>
        </div>
    </div>

    <div class="cloud-main">
        <input type="text" class="search-bar" placeholder="Search my drives...">
        
        <div class="folder-grid">
            <div class="folder-card">
                <div class="folder-icon">📂</div>
                <h4>Project Assets</h4>
                <p style="font-size: 12px; color: #64748b;">1.2 GB • 24 items</p>
            </div>
            <div class="folder-card">
                <div class="folder-icon" style="background: #fef2f2;">📸</div>
                <h4>Summer_Trip</h4>
                <p style="font-size: 12px; color: #64748b;">400 MB • 15 items</p>
            </div>
            <div class="folder-card">
                <div class="folder-icon" style="background: #f0fdf4;">📄</div>
                <h4>Study Notes</h4>
                <p style="font-size: 12px; color: #64748b;">12 MB • 5 items</p>
            </div>
            <div class="folder-card">
                <div class="folder-icon" style="background: #fffbeb;">🎵</div>
                <h4>Chill_Vibes</h4>
                <p style="font-size: 12px; color: #64748b;">250 MB • 30 items</p>
            </div>
        </div>
    </div>
</body>
</html>
